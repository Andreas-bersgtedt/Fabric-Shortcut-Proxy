name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # CI starts the Python proxy and exercises its default configuration. These
  # non-secret values satisfy the fail-closed SigV4 startup validation.
  S3_ACCESS_KEY_ID: ci-test-access-key
  S3_SECRET_ACCESS_KEY: ci-test-secret-key

jobs:
  lint-unused:
    name: lint unused/import checks (ruff F)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff F checks
        run: ruff check . --select F --output-format concise

  test-lite:
    name: pytest lite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # The test suite contains unsigned ASGI requests; SigV4 behavior is
      # covered explicitly by tests/test_auth.py.
      REQUIRE_SIGV4: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Lite package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Lite tests (core only, enterprise excluded)
        run: pytest tests/ --ignore=tests/enterprise -v

  test-enterprise:
    name: pytest enterprise (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      REQUIRE_SIGV4: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Lite + Enterprise packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e ./enterprise

      - name: Run Enterprise tests
        run: pytest tests/enterprise -v

  fabric-compat:
    name: pyiceberg reference-reader validation
    runs-on: ubuntu-latest
    env:
      # validate_pyiceberg uses unsigned HTTP reads against the local test proxy.
      REQUIRE_SIGV4: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start proxy
        run: |
          python main.py > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/readyz > /dev/null; then
              echo "proxy ready"; exit 0
            fi
            sleep 1
          done
          echo "proxy did not become ready" >&2
          cat server.log >&2
          exit 1

      - name: Validate served Iceberg table with pyiceberg
        env:
          S3EMU_SERVER: http://127.0.0.1:9000
        run: python validate_pyiceberg.py

      - name: Stop proxy
        if: always()
        run: kill "$(cat server.pid)" || true

  cpp-linux-conformance:
    name: C++ agent linux conformance parity
    runs-on: ubuntu-latest
    env:
      REQUIRE_SIGV4: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build C++ agent (Linux)
        run: bash agent-cpp/build.sh

      - name: Start Python publisher
        env:
          PORT: "9011"
          ARTIFACT_STORE_SERVING: "1"
          PUBLISH_SERVING_IMAGE: "1"
          ARTIFACT_STORE_DIR: ".artifacts_cpp_ci"
        run: |
          python main.py > py-publisher.log 2>&1 &
          echo $! > py-publisher.pid

      - name: Wait for Python publisher readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9011/readyz > /dev/null; then
              echo "python publisher ready"; exit 0
            fi
            sleep 1
          done
          echo "python publisher did not become ready" >&2
          cat py-publisher.log >&2
          exit 1

      - name: Publish serving image
        run: curl -sf -X POST http://127.0.0.1:9011/_admin/publish-image

      - name: Stop Python publisher
        if: always()
        run: kill "$(cat py-publisher.pid)" || true

      - name: Start C++ agent
        env:
          PORT: "9012"
          STORE_DIR: ".artifacts_cpp_ci"
        run: |
          ./agent-cpp/agent > cpp-agent.log 2>&1 &
          echo $! > cpp-agent.pid

      - name: Wait for C++ agent readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9012/readyz > /dev/null; then
              echo "cpp agent ready"; exit 0
            fi
            sleep 1
          done
          echo "cpp agent did not become ready" >&2
          cat cpp-agent.log >&2
          exit 1

      - name: Validate pyiceberg against C++ agent
        env:
          S3EMU_SERVER: http://127.0.0.1:9012
        run: python validate_pyiceberg.py

      - name: Stop C++ agent
        if: always()
        run: kill "$(cat cpp-agent.pid)" || true

  kubernetes-kind:
    name: Kubernetes hybrid fleet Kind proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyiceberg[pyarrow]>=0.6"

      - name: Install Kind
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: fsp-proof
          config: deploy/kubernetes/overlays/kind/cluster.yaml

      - name: Build and load fleet images
        run: |
          docker build --build-arg FSP_ENTERPRISE=1 -f Dockerfile.python -t fabric-shortcut-proxy-python:dev .
          docker build -f agent-cpp/Dockerfile -t fabric-shortcut-proxy-cpp:dev .
          load_image() {
            local image="$1"
            if kind load docker-image "$image" --name fsp-proof; then
              return 0
            fi
            echo "kind load failed for $image; importing through the node containerd" >&2
            docker save "$image" | docker exec -i fsp-proof-control-plane ctr -n k8s.io images import -
          }
          load_image fabric-shortcut-proxy-python:dev
          load_image fabric-shortcut-proxy-cpp:dev

      - name: Deploy hybrid fleet
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ca.key -out ca.crt -subj '/CN=fsp-manager-ca'
          openssl req -newkey rsa:2048 -nodes -keyout tls.key -out tls.csr \
            -subj '/CN=fsp-manager'
          openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out tls.crt -days 1 -extfile <(printf 'subjectAltName=DNS:fsp-manager')
          kubectl create namespace fabric-shortcut-proxy
          kubectl -n fabric-shortcut-proxy create secret generic fsp-manager-tls \
            --from-file=tls.crt --from-file=tls.key --from-file=ca.crt
          kubectl apply -k deploy/kubernetes/overlays/kind-tls
          kubectl -n fabric-shortcut-proxy wait --for=condition=available deployment/postgres --timeout=180s
          kubectl -n fabric-shortcut-proxy wait --for=condition=ready pod -l app.kubernetes.io/name=fsp-materializer --timeout=900s
          kubectl -n fabric-shortcut-proxy wait --for=condition=available deployment/fsp-manager --timeout=180s
          kubectl -n fabric-shortcut-proxy wait --for=condition=available deployment/fsp-cpp-agent --timeout=180s

      - name: Verify Manager restart re-registers Agents
        run: |
          kubectl -n fabric-shortcut-proxy run fsp-manager-proof-client --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 300
          kubectl -n fabric-shortcut-proxy wait --for=condition=ready pod/fsp-manager-proof-client --timeout=120s
          manager_ip=$(kubectl -n fabric-shortcut-proxy get service fsp-manager -o jsonpath='{.spec.clusterIP}')
          get_agents() {
            kubectl -n fabric-shortcut-proxy exec fsp-manager-proof-client -- \
              curl -fsS --retry 5 --retry-all-errors -u agent:fsp-proof-manager-password "http://$manager_ip:9200/agents"
          }
          for i in $(seq 1 60); do
            before=$(get_agents || true)
            before_count=$(python -c 'import json,sys; print(len(json.load(sys.stdin).get("agents", [])))' <<< "$before" 2>/dev/null || echo 0)
            if [ "$before_count" -ge 3 ]; then break; fi
            sleep 1
          done
          test "$before_count" -ge 3
          manager_pod=$(kubectl -n fabric-shortcut-proxy get pod -l app.kubernetes.io/name=fsp-manager -o jsonpath='{.items[0].metadata.name}')
          kubectl -n fabric-shortcut-proxy delete pod "$manager_pod" --wait=true
          kubectl -n fabric-shortcut-proxy wait --for=condition=available deployment/fsp-manager --timeout=180s
          for i in $(seq 1 60); do
            after=$(get_agents || true)
            after_count=$(python -c 'import json,sys; print(len(json.load(sys.stdin).get("agents", [])))' <<< "$after" 2>/dev/null || echo 0)
            if [ "$after_count" -ge 3 ]; then break; fi
            sleep 1
          done
          test "$after_count" -ge 3

      - name: Scan C++ Service with PyIceberg
        run: |
          kubectl -n fabric-shortcut-proxy port-forward service/shortcut-proxy 9012:80 > port-forward.log 2>&1 &
          echo $! > port-forward.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9012/readyz > /dev/null; then break; fi
            sleep 1
          done
          S3EMU_SERVER=http://127.0.0.1:9012 EXPECTED_ROWS=1200 python validate_pyiceberg.py

      - name: Verify NetworkPolicy isolation
        run: |
          kubectl -n fabric-shortcut-proxy run fsp-allowed-client --image=curlimages/curl:8.10.1 --restart=Never --labels=fabric-shortcut-proxy.io/data-plane-client=true --command -- sleep 120
          kubectl -n fabric-shortcut-proxy run fsp-denied-client --image=curlimages/curl:8.10.1 --restart=Never --command -- sleep 120
          kubectl -n fabric-shortcut-proxy wait --for=condition=ready pod/fsp-allowed-client --timeout=120s
          kubectl -n fabric-shortcut-proxy wait --for=condition=ready pod/fsp-denied-client --timeout=120s
          service_ip=$(kubectl -n fabric-shortcut-proxy get service shortcut-proxy -o jsonpath='{.spec.clusterIP}')
          kubectl -n fabric-shortcut-proxy exec fsp-allowed-client -- curl -fsS --max-time 5 "http://$service_ip/readyz"
          ! kubectl -n fabric-shortcut-proxy exec fsp-denied-client -- curl -fsS --max-time 5 "http://$service_ip/readyz"

      - name: Verify range reads survive a C++ Pod deletion
        run: |
          service_ip=$(kubectl -n fabric-shortcut-proxy get service shortcut-proxy -o jsonpath='{.spec.clusterIP}')
          key=$(kubectl -n fabric-shortcut-proxy exec fsp-allowed-client -- sh -c "curl -fsS 'http://$service_ip/fabric-iceberg-poc?list-type=2' | sed -n 's:.*<Key>\\(.*\\)</Key>.*:\\1:p' | head -n 1")
          test -n "$key"
          target=$(kubectl -n fabric-shortcut-proxy get pods -l app.kubernetes.io/name=fsp-cpp-agent -o jsonpath='{.items[0].metadata.name}')
          (for i in $(seq 1 80); do kubectl -n fabric-shortcut-proxy exec fsp-allowed-client -- curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H "Range: bytes=0-63" "http://$service_ip/fabric-iceberg-poc/$key" > /dev/null; done) &
          reader_pid=$!
          sleep 1
          kubectl -n fabric-shortcut-proxy delete pod "$target" --wait=false
          wait "$reader_pid"
          kubectl -n fabric-shortcut-proxy rollout status deployment/fsp-cpp-agent --timeout=180s

      - name: Collect diagnostics
        if: always()
        run: |
          kubectl -n fabric-shortcut-proxy get pods,pvc,service
          kubectl -n fabric-shortcut-proxy logs statefulset/fsp-materializer --all-containers=true --prefix=true || true
          kubectl -n fabric-shortcut-proxy logs deployment/fsp-cpp-agent --all-containers=true --prefix=true || true
          test ! -f port-forward.pid || kill "$(cat port-forward.pid)" || true

  dead-code-report:
    name: dead code report (vulture, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vulture
        run: |
          python -m pip install --upgrade pip
          pip install vulture

      - name: Run vulture report
        run: vulture . --exclude .venv,tests --min-confidence 80
