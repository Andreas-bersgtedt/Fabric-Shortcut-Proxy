name: C++ serving Agent release

on:
  push:
    tags: ["cpp-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FSP_REQUIRE_CPP_TESTS: "1"
      REQUIRE_SIGV4: "0"
      S3_ACCESS_KEY_ID: ci-test-access-key
      S3_SECRET_ACCESS_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Build and verify tagged version
        shell: bash
        run: |
          set -euo pipefail
          bash agent-cpp/build.sh
          bash agent-cpp/build_tier1.sh
          test "$(./agent-cpp/agent --version)" = "cpp-${GITHUB_REF_NAME#cpp-v}"
      - name: Verify direct authentication and socket hardening
        run: >-
          python -m pytest tests/test_cpp_agent_sigv4.py
          tests/test_sigv4_conformance.py tests/test_auth.py
          tests/test_cpp_agent_hardening.py -v
      - name: Measure concurrent serving and restart behavior
        run: >-
          python agent-cpp/benchmark_auth.py --duration 60 --concurrency 4
          --output cpp-auth-benchmark.json
      - name: Package verified binary and container
        shell: bash
        run: |
          set -euo pipefail
          version="$(./agent-cpp/agent --version)"
          mkdir -p dist
          tar -czf "dist/${version}-linux-x64.tar.gz" \
            agent-cpp/agent agent-cpp/README.md agent-cpp/BENCHMARK.md
          docker build -f agent-cpp/Dockerfile -t "fsp-cpp-agent:${version#cpp-}" .
          test "$(docker run --rm "fsp-cpp-agent:${version#cpp-}" --version)" = "$version"
          docker image inspect "fsp-cpp-agent:${version#cpp-}" \
            --format '{{.Id}}' > dist/container-image-id.txt
          docker save "fsp-cpp-agent:${version#cpp-}" | gzip > "dist/${version}-image.tar.gz"
          cp cpp-auth-benchmark.json dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cpp-release
          path: dist
      - name: Publish release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Stable promotion requires the live release checklist, not just CI.
          case "$RELEASE_TAG" in
            cpp-v*-rc.*) ;;
            *) echo "Stable releases require reviewed live verification evidence." >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease \
            --title "C++ serving Agent ${RELEASE_TAG#cpp-v}" \
            --notes-file agent-cpp/README.md
