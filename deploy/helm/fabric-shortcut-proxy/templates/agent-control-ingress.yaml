{{- if .Values.agentControlIngress.enabled }}
{{- if not .Values.manager.enabled }}
{{- fail "agentControlIngress.enabled requires manager.enabled=true" }}
{{- end }}
{{- $ing := .Values.agentControlIngress }}
{{- $host := required "agentControlIngress.host is required" $ing.host }}
{{- $issuer := $ing.clusterIssuer | default .Values.tls.clusterIssuer.name }}
# Exposes only the Manager routes that materializer agents call. Admin,
# work-queue and data-plane routes are intentionally absent.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsp-agent-control
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    {{- if $ing.pathPrefix }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "$1"
    {{- end }}
    {{- with $ing.sourceRanges }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," . | quote }}
    {{- end }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $ing.tlsSecretName }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range list "/control/register" "/control/heartbeat" "/control/task-result" "/control/materialize" }}
          {{- if $ing.pathPrefix }}
          - path: {{ printf "%s(%s)$" $ing.pathPrefix . | quote }}
            pathType: ImplementationSpecific
          {{- else }}
          - path: {{ . }}
            pathType: Exact
          {{- end }}
            backend:
              service:
                name: fsp-manager
                port:
                  name: control
          {{- end }}
          {{- range list "/control/assignment/" "/control/snapshot/" }}
          {{- if $ing.pathPrefix }}
          - path: {{ printf "%s(%s.*)" $ing.pathPrefix . | quote }}
            pathType: ImplementationSpecific
          {{- else }}
          - path: {{ . }}
            pathType: Prefix
          {{- end }}
            backend:
              service:
                name: fsp-manager
                port:
                  name: control
          {{- end }}
{{- end }}
