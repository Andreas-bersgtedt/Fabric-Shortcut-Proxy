{{- if eq .Values.agentAuth.mode "entra" }}
{{- if not .Values.workloadIdentity.enabled }}
{{- fail "agentAuth.mode=entra requires workloadIdentity.enabled=true" }}
{{- end }}
{{- if .Values.cppAgent.enabled }}
{{- fail "agentAuth.mode=entra currently requires Python control clients; disable cppAgent.enabled" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fsp-common
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
data:
  AGENT_AUTH_MODE: {{ .Values.agentAuth.mode | quote }}
  {{- if eq .Values.agentAuth.mode "entra" }}
  AGENT_ENTRA_TENANT_ID: {{ required "agentAuth.entra.tenantId is required" .Values.agentAuth.entra.tenantId | quote }}
  AGENT_ENTRA_AUDIENCE: {{ required "agentAuth.entra.audience is required" .Values.agentAuth.entra.audience | quote }}
  AGENT_ENTRA_SCOPE: {{ printf "api://%s/.default" .Values.agentAuth.entra.audience | quote }}
  AGENT_ENTRA_IDENTITIES: {{ .Values.agentAuth.entra.identities | toJson | quote }}
  {{- end }}
  S3_BUCKET: {{ .Values.fsp.s3Bucket | quote }}
  ARTIFACT_STORE_BACKEND: {{ .Values.fsp.artifactStoreBackend | quote }}
  ARTIFACT_STORE_DIR: {{ .Values.fsp.artifactStoreDir | quote }}
  ARTIFACT_STORE_SERVING: {{ .Values.fsp.artifactStoreServing | quote }}
  ARTIFACT_STORE_AUTH_MODE: {{ .Values.fsp.artifactStoreAuthMode | quote }}
  ARTIFACT_STORE_TOKEN_FILE: {{ .Values.fsp.artifactStoreTokenFile | quote }}
  {{- with .Values.fsp.artifactStoreAccountUrl }}
  ARTIFACT_STORE_ACCOUNT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.fsp.artifactStoreContainer }}
  ARTIFACT_STORE_CONTAINER: {{ . | quote }}
  {{- end }}
  {{- with .Values.fsp.artifactStoreClientId }}
  ARTIFACT_STORE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.fsp.artifactStoreTenantId }}
  ARTIFACT_STORE_TENANT_ID: {{ . | quote }}
  {{- end }}
  MATERIALIZE_MODE: {{ .Values.fsp.materializeMode | quote }}
  AGENT_SHARD_COUNT: {{ .Values.materializer.replicas | quote }}
  AGENT_POOL_ID: {{ .Values.agentPoolId | quote }}
  AGENT_LOCATION: {{ .Values.agentLocation | quote }}
  SHARD_STRATEGY: {{ .Values.fsp.shardStrategy | quote }}
  MATERIALIZE_WAIT_SECONDS: {{ .Values.fsp.materializeWaitSeconds | quote }}
  GENERATION_SOURCE_CONSISTENCY: {{ .Values.fsp.generationSourceConsistency | quote }}
  GENERATION_MEMBERSHIP_POLICY: {{ .Values.fsp.generationMembershipPolicy | quote }}
  SNAPSHOT_MAX_LIFETIME_SECONDS: {{ .Values.fsp.snapshotMaxLifetimeSeconds | quote }}
  MANAGER_URL: {{ .Values.managerUrl | default "http://fsp-manager:9200" }}
  STREAMING_PARQUET: {{ .Values.fsp.streamingParquet | quote }}
  STREAM_BATCH_ROWS: {{ .Values.fsp.streamBatchRows | quote }}
  SOURCE_MAX_CONCURRENCY: {{ .Values.fsp.sourceMaxConcurrency | quote }}
  MAX_CONCURRENT_GENERATIONS: {{ .Values.fsp.maxConcurrentGenerations | quote }}
  PIN_MATERIALIZED_SPLITS: {{ .Values.fsp.pinMaterializedSplits | quote }}
  REQUIRE_SIGV4: {{ .Values.fsp.requireSigV4 | quote }}
  FSP_AUTH_MODE: {{ .Values.fsp.authMode | quote }}
  FSP_KEYVAULT_WRITE_BACK: {{ .Values.fsp.keyVaultWriteBack | quote }}
  TOKENIZATION_POLICY_FILE: /config/config.tokenization.json
  {{- with .Values.fsp.keyVaultUri }}
  FSP_KEYVAULT_URI: {{ . | quote }}
  {{- end }}
  {{- with .Values.fsp.azureTenantId }}
  AZURE_TENANT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.fsp.azureClientId }}
  AZURE_CLIENT_ID: {{ . | quote }}
  {{- end }}
