{{- if .Values.manager.enabled }}
{{- $mtls := .Values.agentAuth.mtls | default dict }}
{{- $policyBundle := .Values.manager.policyBundle | default dict }}
{{- $policyAzure := $policyBundle.azure | default dict }}
{{- if ($policyBundle.enabled | default false) }}
{{- $hasPolicyUrl := ne ($policyBundle.url | default "") "" }}
{{- $hasPolicyAzure := ne ($policyAzure.accountUrl | default "") "" }}
{{- if eq $hasPolicyUrl $hasPolicyAzure }}
{{- fail "manager.policyBundle requires exactly one of url or azure.accountUrl" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsp-manager
  namespace: {{ include "fsp.namespace" . }}
  labels:
    app.kubernetes.io/name: fsp-manager
    {{- include "fsp.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fsp-manager
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9200"
      labels:
        app.kubernetes.io/name: fsp-manager
        app.kubernetes.io/component: control-plane
        {{- include "fsp.commonLabels" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "fsp.serviceAccountName" . }}
      {{- include "fsp.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "fsp.image" .Values.images.python | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - python
            - -m
            - enterprise.manager
          envFrom:
            - configMapRef:
                name: fsp-common
            - secretRef:
                name: {{ .Values.sourceSecret.name }}
            - secretRef:
                name: {{ .Values.manager.operatorSecretName }}
                optional: true
          env:
            - name: AGENT_AUTH_MODE
              value: {{ .Values.agentAuth.mode | quote }}
            {{- if ($mtls.enabled | default false) }}
            - name: AGENT_MTLS_IDENTITIES
              value: {{ required "agentAuth.mtls.identities is required" $mtls.identities | toJson | quote }}
            - name: AGENT_MTLS_CA_FILE
              value: /etc/fsp-mtls/ca.crt
            {{- end }}
            {{- if ne .Values.agentAuth.mode "entra" }}
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentAuth.secretName }}
                  key: {{ .Values.agentAuth.activeTokenKey }}
            - name: AGENT_TOKEN_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentAuth.secretName }}
                  key: {{ .Values.agentAuth.previousTokenKey }}
                  optional: true
            - name: AGENT_TOKEN_PREVIOUS_VALID_UNTIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentAuth.secretName }}
                  key: {{ .Values.agentAuth.previousValidUntilKey }}
                  optional: true
            {{- if .Values.agentAuth.identityTokensSecretName }}
            - name: AGENT_IDENTITY_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agentAuth.identityTokensSecretName }}
                  key: {{ .Values.agentAuth.identityTokensKey }}
            {{- end }}
            {{- end }}
            - name: AGENT_PLACEMENT_CONFIG
              {{- if ($policyBundle.enabled | default false) }}
              value: "{}"
              {{- else }}
              value: {{ .Values.manager.agentPlacementConfig | toJson | quote }}
              {{- end }}
            {{- if ($policyBundle.enabled | default false) }}
            {{- if $policyBundle.url }}
            - name: FSP_POLICY_BUNDLE_URL
              value: {{ $policyBundle.url | quote }}
            {{- else }}
            - name: FSP_POLICY_BUNDLE_ACCOUNT_URL
              value: {{ required "manager.policyBundle.azure.accountUrl is required" $policyAzure.accountUrl | quote }}
            - name: FSP_POLICY_BUNDLE_CONTAINER
              value: {{ required "manager.policyBundle.azure.container is required" $policyAzure.container | quote }}
            - name: FSP_POLICY_BUNDLE_BLOB_NAME
              value: {{ required "manager.policyBundle.azure.blobName is required" $policyAzure.blobName | quote }}
            - name: FSP_POLICY_BUNDLE_AUTH_MODE
              value: {{ $policyAzure.authMode | quote }}
            - name: FSP_POLICY_BUNDLE_CLIENT_ID
              value: {{ $policyAzure.clientId | quote }}
            - name: FSP_POLICY_BUNDLE_TENANT_ID
              value: {{ $policyAzure.tenantId | quote }}
            - name: FSP_POLICY_BUNDLE_TOKEN_FILE
              value: {{ $policyAzure.tokenFile | quote }}
            {{- end }}
            - name: FSP_POLICY_BUNDLE_PUBLIC_KEY_FILE
              value: /etc/fsp-policy/public-key.pem
            - name: FSP_POLICY_BUNDLE_CACHE_FILE
              value: {{ $policyBundle.cacheFile | quote }}
            - name: FSP_POLICY_BUNDLE_KEY_ID
              value: {{ $policyBundle.keyId | quote }}
            - name: FSP_POLICY_BUNDLE_TIMEOUT_SECONDS
              value: {{ $policyBundle.timeoutSeconds | quote }}
            {{- end }}
            - name: FSP_ARTIFACT_STORE_PROFILE
              value: {{ .Values.manager.artifactStoreProfile | quote }}
            - name: FSP_EGRESS_PRICING
              value: {{ (.Values.manager.egressPricing | default dict) | toJson | quote }}
            {{- if .Values.federation.enabled }}
            - name: FSP_FEDERATION_ENABLED
              value: "1"
            - name: FSP_REGIONAL_MANAGER_ID
              value: {{ required "federation.managerId is required" .Values.federation.managerId | quote }}
            - name: FSP_REGIONAL_MANAGER_LOCATION
              value: {{ required "federation.managerLocation is required" .Values.federation.managerLocation | quote }}
            - name: FSP_CATALOG_OWNER_LEASE_MS
              value: {{ .Values.federation.ownerLeaseMs | quote }}
            - name: FSP_CATALOG_RENEW_INTERVAL_SECONDS
              value: {{ .Values.federation.renewIntervalSeconds | quote }}
            - name: FSP_FEDERATION_REPLICA_STORES
              value: {{ .Values.federation.replicaStores | toJson | quote }}
            - name: FSP_CATALOG_STORE_ACCOUNT_URL
              value: {{ required "federation.catalog.artifactStoreAccountUrl is required" .Values.federation.catalog.artifactStoreAccountUrl | quote }}
            - name: FSP_CATALOG_STORE_CONTAINER
              value: {{ .Values.federation.catalog.artifactStoreContainer | quote }}
            - name: FSP_CATALOG_STORE_AUTH_MODE
              value: {{ .Values.federation.catalog.artifactStoreAuthMode | quote }}
            - name: FSP_CATALOG_STORE_CLIENT_ID
              value: {{ .Values.federation.catalog.artifactStoreClientId | quote }}
            - name: FSP_CATALOG_STORE_TENANT_ID
              value: {{ .Values.federation.catalog.artifactStoreTenantId | quote }}
            - name: FSP_CATALOG_STORE_TOKEN_FILE
              value: {{ .Values.federation.catalog.artifactStoreTokenFile | quote }}
            {{- end }}
            - name: CONTROL_HOST
              value: 0.0.0.0
            - name: CONTROL_PORT
              value: "9200"
            - name: MANAGER_SUPERVISION_MODE
              value: external
            - name: ENABLE_GATEWAY
              value: "0"
            - name: FSP_CONFIG_DIR
              value: /config
            - name: CREDENTIAL_STORE_PATH
              value: {{ .Values.manager.credentialStorePath | quote }}
            - name: OPEN_MIRROR_STATE_DIR
              value: /config/.open_mirror_state
            - name: ENABLE_AUDIT_LOG
              value: {{ .Values.manager.auditLogEnabled | quote }}
            - name: ENABLE_CONFIG_BUILDER
              value: {{ .Values.manager.configBuilderEnabled | quote }}
            - name: ENABLE_MONITOR
              value: {{ .Values.manager.monitorEnabled | quote }}
            - name: ENABLE_ADMIN_UI
              value: {{ .Values.manager.adminUiEnabled | quote }}
            - name: FSP_USER_DIRECTORY_FILE
              value: {{ .Values.manager.userDirectoryFile | quote }}
            - name: AGENT_HOST_ALLOWLIST
              value: {{ .Values.manager.agentHostAllowlist | quote }}
            {{- if .Values.manager.entra.enabled }}
            - name: FSP_ENTRA_ENABLED
              value: "1"
            - name: FSP_ENTRA_TENANT_ID
              value: {{ required "manager.entra.tenantId is required" .Values.manager.entra.tenantId | quote }}
            - name: FSP_ENTRA_SPA_CLIENT_ID
              value: {{ required "manager.entra.spaClientId is required" .Values.manager.entra.spaClientId | quote }}
            - name: FSP_ENTRA_API_CLIENT_ID
              value: {{ required "manager.entra.apiClientId is required" .Values.manager.entra.apiClientId | quote }}
            - name: FSP_ENTRA_API_AUDIENCE
              value: {{ required "manager.entra.apiAudience is required" .Values.manager.entra.apiAudience | quote }}
            - name: FSP_ENTRA_API_SCOPE
              value: {{ .Values.manager.entra.apiScope | quote }}
            - name: FSP_ENTRA_ALLOWED_CLIENT_IDS
              value: {{ required "manager.entra.allowedClientIds is required" .Values.manager.entra.allowedClientIds | quote }}
            - name: FSP_ENTRA_REDIRECT_URI
              value: {{ required "manager.entra.redirectUri is required" .Values.manager.entra.redirectUri | quote }}
            - name: FSP_ENTRA_POST_LOGOUT_REDIRECT_URI
              value: {{ required "manager.entra.postLogoutRedirectUri is required" .Values.manager.entra.postLogoutRedirectUri | quote }}
            {{- end }}
          ports:
            - name: control
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 10
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            {{- if .Values.storage.azureFiles.enabled }}
            - name: artifacts
              mountPath: /artifacts
              {{- with .Values.storage.azureFiles.artifacts.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: config
              mountPath: /config
              {{- with .Values.storage.azureFiles.managerConfig.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            {{- else }}
            - name: artifacts
              mountPath: /config
            {{- end }}
            {{- if ($mtls.enabled | default false) }}
            - name: agent-mtls-ca
              mountPath: /etc/fsp-mtls
              readOnly: true
            {{- end }}
            {{- if ($policyBundle.enabled | default false) }}
            - name: policy-bundle-public-key
              mountPath: /etc/fsp-policy
              readOnly: true
            {{- end }}
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: fsp-artifacts
        {{- if .Values.storage.azureFiles.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: fsp-manager-config
        {{- end }}
        {{- if ($mtls.enabled | default false) }}
        - name: agent-mtls-ca
          secret:
            secretName: {{ required "agentAuth.mtls.caSecretName is required" $mtls.caSecretName }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if ($policyBundle.enabled | default false) }}
        - name: policy-bundle-public-key
          secret:
            secretName: {{ required "manager.policyBundle.publicKeySecretName is required" $policyBundle.publicKeySecretName }}
            items:
              - key: {{ $policyBundle.publicKeySecretKey }}
                path: public-key.pem
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: fsp-manager
  namespace: {{ include "fsp.namespace" . }}
  labels:
    app.kubernetes.io/name: fsp-manager
    {{- include "fsp.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: fsp-manager
  ports:
    - name: control
      port: 9200
      targetPort: control
{{- end }}
