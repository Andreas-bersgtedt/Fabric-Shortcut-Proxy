{{- if .Values.workloadIdentity.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.serviceAccountName }}
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
  annotations:
    {{- if and .Values.gcp.enabled (eq .Values.gcp.workloadIdentityProvider "gke") }}
    iam.gke.io/gcp-service-account: {{ required "gcp.serviceAccountEmail is required for GKE Workload Identity" .Values.gcp.serviceAccountEmail | quote }}
    {{- else }}
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    {{- end }}
{{- with .Values.images.pullSecrets }}
imagePullSecrets:
{{- range . }}
  - name: {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
