{{- include "fsp.validateNginxTls" . }}
{{- if .Values.tls.enabled }}
{{- $hostname := required "tls.hostname is required" .Values.tls.hostname }}
{{- if .Values.tls.clusterIssuer.create }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.tls.clusterIssuer.name }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.tls.clusterIssuer.acmeServer }}
    {{- with .Values.tls.clusterIssuer.email }}
    email: {{ . | quote }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Values.tls.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.tls.ingress.className }}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fsp-nginx-tls
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
spec:
  secretName: {{ .Values.nginx.certificateSecretName }}
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.tls.clusterIssuer.name }}
    kind: ClusterIssuer
  dnsNames:
    - {{ $hostname | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsp-config-public
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.tls.ingress.className }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ .Values.nginx.certificateSecretName }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /_config
            pathType: Prefix
            backend:
              service:
                name: fsp-manager
                port:
                  name: control
          - path: /_manager
            pathType: Prefix
            backend:
              service:
                name: fsp-manager
                port:
                  name: control
          - path: /_monitor
            pathType: Prefix
            backend:
              service:
                name: fsp-manager
                port:
                  name: control
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsp-nginx-public
  namespace: {{ include "fsp.namespace" . }}
  labels:
    {{- include "fsp.commonLabels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.tls.ingress.className }}
  tls:
    - hosts:
        - {{ $hostname | quote }}
      secretName: {{ .Values.nginx.certificateSecretName }}
  rules:
    - host: {{ $hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fsp-nginx-public
                port:
                  name: https
{{- end }}
