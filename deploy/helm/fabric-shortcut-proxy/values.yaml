namespace:
  create: true
  name: fabric-shortcut-proxy

images:
  pullPolicy: IfNotPresent
  pullSecrets: []
  python:
    repository: fabric-shortcut-proxy-python
    tag: "3.0.1"
    digest: ""
  cpp:
    repository: fabric-shortcut-proxy-cpp
    tag: "3.0.1"
    digest: ""
  nginx:
    repository: nginx
    tag: 1.27-alpine
    digest: sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10

# In-cluster default. Remote materializer sites point this at the
# Manager agent-control ingress, e.g. https://fsp-control.example.com
managerUrl: http://fsp-manager:9200

# Short site identifier. When set, materializers register with the Manager
# as "<siteId>-<pod-name>:9000" instead of "<hostname>:9000", so StatefulSet
# pods with the same name at different sites do not collide. Leave empty in
# the control cluster to keep existing agent ids; set it at every remote site.
siteId: ""

# Optional placement metadata announced when agents register with the Manager.
agentPoolId: ""
agentLocation: ""

agentAuth:
  mode: required
  secretName: fsp-agent-auth
  activeTokenKey: AGENT_TOKEN
  previousTokenKey: AGENT_TOKEN_PREVIOUS
  previousValidUntilKey: AGENT_TOKEN_PREVIOUS_VALID_UNTIL
  identityTokensSecretName: ""
  identityTokensKey: AGENT_IDENTITY_TOKENS

fsp:
  s3Bucket: fabric-iceberg-poc
  artifactStoreBackend: local
  artifactStoreDir: /artifacts
  artifactStoreServing: "1"
  artifactStoreAccountUrl: ""
  artifactStoreContainer: ""
  artifactStoreAuthMode: managed_identity
  artifactStoreClientId: ""
  artifactStoreTenantId: ""
  artifactStoreTokenFile: ""
  materializeMode: eager
  shardStrategy: modulo
  materializeWaitSeconds: "600"
  generationSourceConsistency: best_effort
  generationMembershipPolicy: elastic
  snapshotMaxLifetimeSeconds: "3600"
  streamingParquet: "1"
  streamBatchRows: "10000"
  sourceMaxConcurrency: "2"
  maxConcurrentGenerations: "2"
  pinMaterializedSplits: "0"
  requireSigV4: "0"
  authMode: local
  keyVaultUri: ""
  keyVaultWriteBack: "0"
  azureTenantId: ""
  azureClientId: ""

sourceSecret:
  name: fsp-source

workloadIdentity:
  enabled: false
  serviceAccountName: fsp-workload
  clientId: ""

nodeSelector: {}

storage:
  artifacts:
    size: 100Gi
    storageClassName: null
    existingVolumeName: ""
  azureFiles:
    enabled: false
    resourceGroup: ""
    storageAccount: ""
    protocol: nfs
    encryptInTransit: "true"
    reclaimPolicy: Retain
    mountOptions:
      - nconnect=4
      - noresvport
      - actimeo=30
    artifacts:
      shareName: artifacts
      volumeHandle: ""
    managerConfig:
      shareName: manager-config
      volumeHandle: ""
      size: 100Gi

manager:
  enabled: true
  replicas: 1
  agentPlacementConfig: {}
  auditLogEnabled: "0"
  configBuilderEnabled: "0"
  monitorEnabled: "1"
  adminUiEnabled: "0"
  userDirectoryFile: /config/users.json
  credentialStorePath: /config/credentials.json
  agentHostAllowlist: "127.0.0.1,0.0.0.0,::1,::,localhost"
  operatorSecretName: fsp-manager-auth
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  entra:
    enabled: false
    tenantId: ""
    spaClientId: ""
    apiClientId: ""
    apiAudience: ""
    apiScope: operator.access_as_user
    allowedClientIds: ""
    redirectUri: ""
    postLogoutRedirectUri: ""

materializer:
  replicas: 3
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 8
    targetCpuUtilization: 70
    scaleDownStabilizationSeconds: 300
  auditLogEnabled: "0"
  credentialStoreEnabled: "0"
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # Egress allow-list for materializer pods. Off by default so existing
  # deployments keep their current network behaviour.
  egress:
    enabled: false
    # Allow egress to an in-cluster Manager (pod selector, port 9200).
    allowLocalManager: true
    # CIDRs of a remote Manager agent-control ingress (port 443).
    managerCidrs: []
    managerPort: 443
    # Extra destinations, e.g. the site-local source storage endpoint:
    # - cidr: 10.20.0.0/16
    #   ports: [443]
    allowList: []

cppAgent:
  enabled: true
  materializeTimeoutMs: "600000"
  s3AuthMode: trusted-upstream
  s3AuthSecretName: fsp-cpp-s3-auth
  s3AccessKeyIdKey: S3_ACCESS_KEY_ID
  s3SecretAccessKeyKey: S3_SECRET_ACCESS_KEY
  s3AllowedPrefixes: ""
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: "2"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCpuUtilization: 70
    scaleDownStabilizationSeconds: 300
  disruptionBudget:
    minAvailable: 1

nginx:
  enabled: false
  replicas: 3
  certificateSecretName: fsp-nginx-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  disruptionBudget:
    minAvailable: 2
  privateService:
    enabled: true
    subnet: ""
    ipAddress: ""

tls:
  enabled: false
  hostname: ""
  clusterIssuer:
    create: true
    name: letsencrypt-prod
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    email: ""
  ingress:
    className: nginx

# Private TLS ingress that exposes only the agent-control routes of the
# Manager to remote materializer sites. Admin (/_config, /_manager,
# /_monitor), work-queue and data routes are never routed by this ingress.
agentControlIngress:
  enabled: false
  host: ""
  className: nginx
  tlsSecretName: fsp-agent-control-tls
  clusterIssuer: ""
  # Optional source ranges, applied as nginx whitelist-source-range.
  sourceRanges: []
  annotations: {}
