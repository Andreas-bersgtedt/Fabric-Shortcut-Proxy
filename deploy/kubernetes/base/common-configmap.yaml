apiVersion: v1
kind: ConfigMap
metadata:
  name: fsp-common
  namespace: fabric-shortcut-proxy
  labels:
    app.kubernetes.io/part-of: fabric-shortcut-proxy
data:
  S3_BUCKET: fabric-iceberg-poc
  ARTIFACT_STORE_BACKEND: local
  ARTIFACT_STORE_DIR: /artifacts
  ARTIFACT_STORE_SERVING: "1"
  MATERIALIZE_MODE: eager
  AGENT_SHARD_COUNT: "3"
  SHARD_STRATEGY: modulo
  MATERIALIZE_WAIT_SECONDS: "600"
  GENERATION_SOURCE_CONSISTENCY: best_effort
  MANAGER_URL: http://fsp-manager:9200
  STREAMING_PARQUET: "1"
  STREAM_BATCH_ROWS: "10000"
  SOURCE_MAX_CONCURRENCY: "2"
  MAX_CONCURRENT_GENERATIONS: "2"
  PIN_MATERIALIZED_SPLITS: "0"
  REQUIRE_SIGV4: "0"
