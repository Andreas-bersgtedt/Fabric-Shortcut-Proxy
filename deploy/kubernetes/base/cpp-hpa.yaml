apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fsp-cpp-agent
  namespace: fabric-shortcut-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fsp-cpp-agent
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
