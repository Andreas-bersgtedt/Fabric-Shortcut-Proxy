apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cpp-agent-private-ingress
spec:
  podSelector:
    matchLabels:
      app: cpp-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 9400}
