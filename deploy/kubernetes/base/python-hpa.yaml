apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fsp-materializer
  namespace: fabric-shortcut-proxy
  labels:
    app.kubernetes.io/part-of: fabric-shortcut-proxy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: fsp-materializer
  minReplicas: 3
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
