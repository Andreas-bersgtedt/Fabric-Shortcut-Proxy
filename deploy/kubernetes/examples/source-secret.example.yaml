apiVersion: v1
kind: Secret
metadata:
  name: fsp-source
  namespace: fabric-shortcut-proxy
type: Opaque
stringData:
  DB_URL: postgresql+asyncpg://fsp_reader:replace-me@postgres.example.internal:5432/source_db
  # Required only when MANAGER_URL is configured for Agent Pods.
  MANAGER_AUTH_USERNAME: agent
  MANAGER_AUTH_PASSWORD: replace-me
  # Required only when MANAGER_SUPERVISION_MODE=external: without it, the Manager
  # can't authenticate its /_monitor scrapes against externally-deployed Agents
  # (each verifies the header against its own FSP_INTERNAL_MONITOR_TOKEN env var).
  FSP_INTERNAL_MONITOR_TOKEN: replace-me-with-a-random-secret
