apiVersion: v1
kind: Service
metadata:
  name: fsp-materializer-internal
  namespace: fabric-shortcut-proxy
  labels:
    app.kubernetes.io/name: fsp-materializer
    app.kubernetes.io/part-of: fabric-shortcut-proxy
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-internal-subnet: aks-app
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: materializer
  ports:
    - name: s3
      port: 9000
      targetPort: health