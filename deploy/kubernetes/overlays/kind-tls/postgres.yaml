apiVersion: v1
kind: ConfigMap
metadata:
  name: fsp-postgres-init
  namespace: fabric-shortcut-proxy
data:
  init.sql: |
    CREATE TABLE sales (id BIGINT PRIMARY KEY, order_date DATE, customer_id BIGINT, product TEXT, quantity INTEGER, unit_price DOUBLE PRECISION, total DOUBLE PRECISION, region TEXT);
    INSERT INTO sales SELECT i, DATE '2023-01-01' + ((i - 1) % 365)::integer, 1000 + (i % 50), 'Widget-' || (i % 7), 1 + (i % 10)::integer, 10.5 + (i % 20), (1 + (i % 10)) * (10.5 + (i % 20)), (ARRAY['North','South','East','West'])[(i % 4) + 1] FROM generate_series(1, 1200) AS i;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fabric-shortcut-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{secretRef: {name: fsp-source}}]
          ports: [{containerPort: 5432, name: postgres}]
          volumeMounts: [{name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}]
      volumes: [{name: init, configMap: {name: fsp-postgres-init}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fabric-shortcut-proxy
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{port: 5432, targetPort: postgres, name: postgres}]