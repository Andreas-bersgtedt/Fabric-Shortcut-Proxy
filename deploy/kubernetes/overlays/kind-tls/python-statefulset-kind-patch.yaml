apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fsp-materializer
  namespace: fabric-shortcut-proxy
spec:
  template:
    spec:
      containers:
        - name: materializer
          imagePullPolicy: Never
          env: [{name: NUM_SPLITS, value: "12"}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}