apiVersion: v1
kind: Pod
metadata:
  name: fsp-smoke-client
  namespace: fabric-shortcut-proxy
  labels:
    fabric-shortcut-proxy.io/data-plane-client: "true"
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sleep
        - "3600"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
