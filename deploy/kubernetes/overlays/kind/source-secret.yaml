apiVersion: v1
kind: Secret
metadata:
  name: fsp-source
  namespace: fabric-shortcut-proxy
type: Opaque
stringData:
  DB_URL: postgresql+asyncpg://fsp_reader:fsp-proof-password@postgres:5432/source_db
  POSTGRES_DB: source_db
  POSTGRES_USER: fsp_reader
  POSTGRES_PASSWORD: fsp-proof-password
  MANAGER_AUTH_USERNAME: agent
  MANAGER_AUTH_PASSWORD: fsp-proof-manager-password
