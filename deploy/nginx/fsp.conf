# Reference nginx site for the Fabric Shortcut Proxy agent fleet (external LB, Option A).
#
# The upstream block is rendered by control/lb_renderer.py from the Manager's
# GET /agents (only alive + ready agents) and included below; the renderer runs
# `nginx -s reload` on change. Point the Fabric shortcut at THIS load balancer, and
# run the Manager control-only (ENABLE_GATEWAY=0) so nothing is served through the
# built-in Python gateway.
#
# Install: copy into /etc/nginx/conf.d/ (or an http{} include). Keep the include
# path below in sync with the renderer's --out.

# Rendered by control/lb_renderer.py (see deploy/nginx/upstream.conf.example).
include /etc/nginx/conf.d/fsp_upstream.conf;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS terminates here; agents stay on a private network (see Phase 4).
    ssl_certificate     /etc/nginx/tls/fsp.crt;
    ssl_certificate_key /etc/nginx/tls/fsp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Large ranged Parquet reads: stream through, do not buffer, allow slow/long
    # transfers. client_max_body_size 0 disables the request body cap (GET/HEAD
    # dominate, but PUT-style calls must not be truncated by the LB).
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_read_timeout      300s;
    proxy_send_timeout      300s;

    # Never expose Manager control or operator surfaces through the data-plane LB.
    location ~ ^/(_manager|_config|_monitor|control|agents)(/|$) { return 404; }

    location / {
        proxy_pass http://fsp_agents;
        proxy_http_version 1.1;

        # Optional per-client limits (need the zones above uncommented):
        # limit_req  zone=fsp_rl burst=400 nodelay;
        # limit_conn fsp_cc 100;

        # SigV4 is signed over the Host the client (Fabric) sent and the
        # Authorization header; pass both through UNCHANGED so the agent verifies.
        proxy_set_header Host          $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection    "";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passive backstop only; the renderer's /readyz probe is the real health
        # signal. Retry the next agent on a transport error or 502/503.
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
