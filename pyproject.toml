[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-shortcut-proxy"
version = "1.0.0"
description = "Fabric Shortcut Proxy for Microsoft Fabric (POC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyarrow>=15.0",
    "fastavro>=1.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # SQLite async driver (demo / dev)
    "aioodbc>=0.5",            # SQL Server async driver (production)
    "databricks-sqlalchemy>=2.0",  # Databricks SQLAlchemy dialect/plugin
    "structlog>=24.1",
    "tzdata>=2024.1",          # IANA tz data (Windows) — needed to read tz-aware timestamp values
    "psutil>=5.9",             # Process memory/CPU monitoring
    "httpx>=0.27",          # for integration tests
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
# Reference-reader validation used by the CI "fabric-compat" job, plus botocore
# for signing requests in the SigV4 auth tests.
dev = [
    "pyiceberg[pyarrow]>=0.6",
    "botocore>=1.34",
]

[tool.setuptools]
py-modules = ["main", "config", "manager"]
packages = [
    "cache",
    "control",
    "db",
    "delta",
    "demo",
    "iceberg",
    "observability",
    "parquet",
    "planner",
    "runtime",
    "s3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
