[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-shortcut-proxy"
version = "2.7.1"
description = "Fabric Shortcut Proxy for Microsoft Fabric (POC)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9", # backup restore upload parsing
    "uvicorn[standard]>=0.29",
    "pyarrow>=15.0",
    "fastavro>=1.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # SQLite async driver (demo / dev)
    "aioodbc>=0.5",            # SQL Server async driver (production)
    "databricks-sqlalchemy>=2.0",  # Databricks SQLAlchemy dialect/plugin
    "cryptography>=42.0",       # password-encrypted portable backup + Fernet credentials
    "structlog>=24.1",
    "tzdata>=2024.1",          # IANA tz data (Windows) — needed to read tz-aware timestamp values
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
# Reference-reader validation used by the CI "fabric-compat" job, plus botocore
# for signing requests in the SigV4 auth tests, and httpx as the ASGI test client.
# httpx is not a Lite runtime dependency; only the enterprise cluster code uses it
# at runtime, so it ships with fabric-shortcut-proxy-enterprise (see enterprise/).
dev = [
    "pyiceberg[pyarrow]>=0.6",
    "botocore>=1.34",
    "httpx>=0.27",
]
# Source-DB drivers loaded by SQLAlchemy via the URL scheme. Kept out of core so
# SQLite/SQL Server installs stay lean; install the extra for the source you use.
postgres = ["asyncpg>=0.29"]        # postgresql+asyncpg://
oracle = ["oracledb>=2.0"]          # oracle+oracledb://
# Issue #9 expanded sources (all sync-driver; SQLAlchemy plugin + DBAPI). The exact
# Redshift DBAPI and Impala plugin name are confirmed in the driver decision gate.
redshift = ["sqlalchemy-redshift>=1.0", "redshift-connector>=2.1"]  # redshift+redshift_connector://
teradata = ["teradatasqlalchemy>=20.0"]  # teradatasql://
impala = ["impyla>=0.24"]               # impala://
# Complete source-driver set used by the Manager bootstrap so selecting a source
# in the Config Builder never requires a second Python package installation.
drivers = [
    "asyncpg>=0.29",
    "oracledb>=2.0",
    "sqlalchemy-redshift>=1.0",
    "redshift-connector>=2.1",
    "teradatasqlalchemy>=20.0",
    "impyla>=0.24",
]
# Encrypted credential store: Fernet backend for non-Windows hosts (Windows uses
# DPAPI via ctypes, no extra needed).
credentials = []
# Native S3 / MinIO / S3-compatible mount backend (storage proxy, Phase 2). Kept
# out of core so local/NFS/SMB mounts install without a cloud SDK.
s3proxy = ["boto3>=1.34"]
# Native Azure Blob / ADLS Gen2 mount backend (storage proxy, Phase 3). azure-identity
# powers the AAD auth modes (service principal, managed identity, default chain).
azureblob = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
# Azure Key Vault secret source (issue #16): resolve secrets from Key Vault into the
# encrypted local cache so no secret lives in config. azure-identity supplies the
# managed-identity / service-principal / default credential; kept out of core.
keyvault = ["azure-keyvault-secrets>=4.7", "azure-identity>=1.15"]
# OneLake (ADLS Gen2) Open Mirroring landing-zone writer: push Parquet + metadata
# into a Fabric mirrored database over the DFS endpoint. Reuses the proxy's own
# Entra identity (issue #16); kept out of core so non-mirroring installs stay lean.
onelake = ["azure-storage-file-datalake>=12.14", "azure-identity>=1.15"]
# Object-store tokenizer readers (issue #12): read an existing Delta/Iceberg table
# from a mount and tokenize it proxy-side. Kept out of core so mounts without a
# tokenizing format install without delta-rs / pyiceberg.
objectstore = ["deltalake>=0.18", "pyiceberg[pyarrow]>=0.6"]

[tool.setuptools]
# Lite (fabric-shortcut-proxy) ships the single-node core only. The scale-out
# cluster code lives in the enterprise/ package and is published as the separate
# fabric-shortcut-proxy-enterprise distribution (see enterprise/pyproject.toml).
py-modules = ["main", "config", "system_config", "connection_config"]
packages = [
    "cache",
    "configbuilder",
    "db",
    "delta",
    "demo",
    "iceberg",
    "monitor",
    "observability",
    "parquet",
    "planner",
    "runtime",
    "s3",
    "security",
    "storage",
    "tokenization",
]

[tool.setuptools.package-data]
configbuilder = ["*.html"]
monitor = ["*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# config.py deliberately re-exports settings from system_config / connection_config
# so callers can read them as config.X; ruff sees those imports as unused (F401).
"config.py" = ["F401"]
